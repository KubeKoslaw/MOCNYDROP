name: CI

# Repo na etapie dokumentacji i diagramow: nie ma jeszcze kodu aplikacji.
# Kroki ponizej przechodza takze wtedy, gdy plikow PHP/JS jeszcze nie ma,
# a zaczna realnie sprawdzac kod, gdy tylko pojawi sie w repo.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: PHP 8.2
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Lint PHP (php -l)
        run: |
          err=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            php -l "$f" || err=1
          done < <(git ls-files '*.php')
          exit $err

      - name: Node 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Skladnia JS (node --check)
        run: |
          err=0
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            node --check "$f" || err=1
          done < <(git ls-files '*.js')
          exit $err

      - name: Schema SQL importuje sie do SQLite
        run: |
          if [ ! -f database/schema.sql ]; then
            echo "Brak database/schema.sql - krok pominiety."
          elif ! command -v sqlite3 >/dev/null 2>&1; then
            echo "Brak sqlite3 na runnerze - krok pominiety (doinstaluj w workflow, gdy pojawi sie schemat)."
          else
            sqlite3 :memory: < database/schema.sql
          fi

      - name: Seed CSV ma rowna liczbe kolumn w kazdym wierszu
        run: |
          err=0
          found=0
          for f in database/seed/*.csv; do
            [ -e "$f" ] || continue
            found=1
            n=$(awk -F, 'NR>1{print NF}' "$f" | sort -u | wc -l)
            if [ "$n" -gt 1 ]; then echo "::error file=$f::Nierowna liczba kolumn w wierszach CSV"; err=1; fi
          done
          [ "$found" -eq 1 ] || echo "Brak database/seed/*.csv - krok pominiety."
          exit $err
